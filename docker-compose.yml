services:
  app:
    build: .
    container_name: crash-live-collector-starter
    restart: unless-stopped
    environment:
      PORT: "3000"
    ports:
      - "127.0.0.1:3038:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
